<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}NutriStar — Nutrition Tracker{% endblock %}</title>
    <meta name="description" content="Minimalist, clinical Indian food nutrition tracker.">
    
    <!-- System & Inter Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/styles.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Top Navigation (Desktop) -->
    <header class="top-nav">
        <div class="top-nav-inner">
            <a href="/dashboard" class="brand">
                <span>NutriStar</span>
                <span class="brand-badge">Tracker</span>
            </a>

            <nav class="nav-links">
                <a href="/dashboard" class="nav-item" data-path="/dashboard">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Dashboard</span>
                </a>
                <a href="/log-food" class="nav-item" data-path="/log-food">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>Log</span>
                </a>
                <a href="/meals" class="nav-item" data-path="/meals">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>History</span>
                </a>
                <a href="/profile" class="nav-item" data-path="/profile">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Fixed Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="/dashboard" class="mobile-nav-item" data-path="/dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Dashboard</span>
        </a>
        <a href="/log-food" class="mobile-nav-item" data-path="/log-food">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Log</span>
        </a>
        <a href="/meals" class="mobile-nav-item" data-path="/meals">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>History</span>
        </a>
        <a href="/profile" class="mobile-nav-item" data-path="/profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            
            // Set active class for desktop & mobile navigation
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(link => {
                const path = link.getAttribute('data-path');
                if (path === currentPath || (currentPath.startsWith(path) && path !== '/')) {
                    link.classList.add('active');
                }
            });

            // Redirect to onboarding if profile is not set up
            if (currentPath !== '/onboarding' && !currentPath.startsWith('/api')) {
                const profile = Storage.getProfile();
                if (!profile) {
                    window.location.href = '/onboarding';
                }
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
