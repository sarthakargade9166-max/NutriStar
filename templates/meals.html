{% extends "base.html" %}

{% block title %}History — NutriStar{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto;">
    <div class="flex justify-between items-center mb-4" style="margin-bottom: var(--space-4);">
        <div>
            <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0;">History</h1>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;">Daily logs and nutrition breakdown</p>
        </div>
        <a href="/log-food" class="btn btn-primary btn-sm">+ Log Food</a>
    </div>

    <!-- History Days List -->
    <div id="history-days-list" class="flex-col gap-2">
        <!-- Rendered by JS -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let expandedDates = new Set([Storage.getTodayDateString()]);

    document.addEventListener('DOMContentLoaded', () => {
        renderHistory();
    });

    function toggleDay(dateStr) {
        if (expandedDates.has(dateStr)) {
            expandedDates.delete(dateStr);
        } else {
            expandedDates.add(dateStr);
        }
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-days-list');
        const allLogs = Storage.getAllMealLogs();
        const targets = Storage.getTargets() || { calories: 2000 };
        const tgtCals = targets.calories || targets.calories_kcal || 2000;

        const daysList = [];
        const today = new Date();

        // Past 14 days
        for (let i = 0; i < 14; i++) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const dateStr = d.toISOString().split('T')[0];
            const logs = allLogs[dateStr] || { breakfast: [], lunch: [], snack: [], dinner: [] };
            const totals = calculateTotals(logs);
            daysList.push({
                dateStr: dateStr,
                isToday: i === 0,
                isYesterday: i === 1,
                logs: logs,
                totals: totals
            });
        }

        container.innerHTML = daysList.map(day => {
            const isExpanded = expandedDates.has(day.dateStr);
            const displayTitle = day.isToday ? `Today (${Storage.formatDateDisplay(day.dateStr)})` :
                                (day.isYesterday ? `Yesterday (${Storage.formatDateDisplay(day.dateStr)})` :
                                Storage.formatDateDisplay(day.dateStr));

            let dayDetailsHtml = '';
            if (isExpanded) {
                const meals = [
                    { key: 'breakfast', label: 'Breakfast' },
                    { key: 'lunch', label: 'Lunch' },
                    { key: 'snack', label: 'Snack' },
                    { key: 'dinner', label: 'Dinner' }
                ];

                let allItemsCount = 0;
                const mealRows = meals.map(m => {
                    const items = day.logs[m.key] || [];
                    allItemsCount += items.length;
                    if (items.length === 0) return '';

                    const itemsList = items.map(itm => `
                        <div class="data-row" style="padding: var(--space-2) 0;">
                            <div>
                                <span style="font-weight: 500; font-size: 0.86rem;">${escapeHtml(itm.name)}</span>
                                <span style="font-size: 0.76rem; color: var(--text-muted); margin-left: var(--space-2);">${escapeHtml(itm.quantity)} ${escapeHtml(itm.unit)}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span style="font-size: 0.84rem; font-weight: 500; color: var(--text-secondary);">${Math.round(itm.calories)} kcal</span>
                                <button class="btn-delete" onclick="event.stopPropagation(); deleteHistoryItem('${escapeHtml(day.dateStr)}', '${escapeHtml(m.key)}', '${escapeHtml(itm.id)}')" title="Delete">✕</button>
                            </div>
                        </div>
                    `).join('');

                    return `
                        <div style="margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--border-subtle);">
                            <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">${m.label}</div>
                            ${itemsList}
                        </div>
                    `;
                }).join('');

                dayDetailsHtml = `
                    <div style="margin-top: var(--space-3); border-top: 1px solid var(--border-default); padding-top: var(--space-2);">
                        <div class="flex justify-between items-center text-xs" style="color: var(--text-muted); padding: var(--space-1) 0;">
                            <span>Macros: P: ${day.totals.protein}g · C: ${day.totals.carbs}g · F: ${day.totals.fat}g</span>
                            <a href="/log-food?date=${day.dateStr}" class="btn btn-ghost btn-sm" style="font-size: 0.78rem; padding: 2px 6px;">+ Log Food</a>
                        </div>
                        ${allItemsCount > 0 ? mealRows : '<div style="font-size: 0.82rem; color: var(--text-muted); padding: var(--space-2) 0;">No foods logged for this date.</div>'}
                    </div>
                `;
            }

            return `
                <div class="panel" style="margin-bottom: var(--space-2); cursor: pointer;" onclick="toggleDay('${day.dateStr}')">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <span style="font-size: 0.75rem; color: var(--text-muted);">${isExpanded ? '▼' : '▶'}</span>
                            <span style="font-weight: 600; font-size: 0.92rem; color: var(--text-primary);">${displayTitle}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span style="font-weight: 600; font-size: 0.92rem; color: ${day.totals.calories > 0 ? 'var(--text-primary)' : 'var(--text-muted)'};">
                                ${day.totals.calories.toLocaleString()} / ${tgtCals.toLocaleString()} kcal
                            </span>
                        </div>
                    </div>
                    ${dayDetailsHtml}
                </div>
            `;
        }).join('');
    }

    function deleteHistoryItem(dateStr, mealKey, itemId) {
        Storage.deleteMealItem(dateStr, mealKey, itemId);
        showToast('Item deleted');
        renderHistory();
    }
</script>
{% endblock %}
