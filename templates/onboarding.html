{% extends "base.html" %}

{% block title %}Onboarding - NutriStar{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 540px;">
    <div class="auth-header">
        <h1 class="brand-title">Welcome to NutriStar</h1>
        <p class="auth-subtitle">Set up your biometrics and daily macro targets</p>
    </div>

    <form method="POST" action="{{ url_for('routes.onboarding') }}" class="profile-form">
        <div class="form-row">
            <div class="form-group flex-1">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" value="{{ profile.name if profile else 'User' }}" required class="input-field">
            </div>
            <div class="form-group flex-1">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" value="{{ profile.age if profile else 25 }}" required min="10" max="120" class="input-field">
            </div>
            <div class="form-group flex-1">
                <label for="gender">Sex</label>
                <select id="gender" name="gender" class="select-field">
                    <option value="male" selected>Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group flex-1">
                <label for="height_cm">Height (cm)</label>
                <input type="number" id="height_cm" name="height_cm" value="{{ profile.height_cm|int if profile else 175 }}" required min="100" max="250" class="input-field">
            </div>
            <div class="form-group flex-1">
                <label for="current_weight_kg">Current Weight (kg)</label>
                <input type="number" id="current_weight_kg" name="current_weight_kg" value="{{ profile.current_weight_kg if profile else 70 }}" step="0.1" required class="input-field">
            </div>
            <div class="form-group flex-1">
                <label for="target_weight_kg">Target Weight (kg)</label>
                <input type="number" id="target_weight_kg" name="target_weight_kg" value="{{ profile.target_weight_kg if profile else 70 }}" step="0.1" required class="input-field">
            </div>
        </div>

        <div class="form-group">
            <label for="activity_level">Activity Level</label>
            <select id="activity_level" name="activity_level" class="select-field">
                <option value="sedentary">Sedentary (Little or no exercise)</option>
                <option value="light">Light (Exercise 1-3 days/week)</option>
                <option value="moderate" selected>Moderate (Exercise 3-5 days/week)</option>
                <option value="very_active">Very Active (Exercise 6-7 days/week)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="target_rate_kg_per_week">Target Rate (kg/week)</label>
            <input type="number" id="target_rate_kg_per_week" name="target_rate_kg_per_week" value="0.5" step="0.1" min="0.1" max="1.5" class="input-field">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Complete Setup & Go to Dashboard</button>
    </form>
</div>
{% endblock %}
