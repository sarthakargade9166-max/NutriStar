{% extends "base.html" %}

{% block title %}Log Food — NutriTrack{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
    <!-- Top Header -->
    <div class="flex justify-between items-center mb-4" style="margin-bottom: var(--space-4);">
        <div class="flex items-center gap-3">
            <a href="/dashboard" class="btn btn-ghost btn-icon" title="Back" style="font-size: 1.1rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h1 style="font-size: 1.35rem; font-weight: 700; margin: 0;">Log Food</h1>
        </div>

        <div style="width: 140px;">
            <select id="meal-select" class="select" style="font-size: 0.85rem; padding: 6px 28px 6px 10px;">
                <option value="breakfast">Breakfast</option>
                <option value="lunch" selected>Lunch</option>
                <option value="snack">Snack</option>
                <option value="dinner">Dinner</option>
            </select>
        </div>
    </div>

    <!-- Search Box -->
    <div style="margin-bottom: var(--space-4);">
        <input type="text" id="search-input" class="input" placeholder="Search food..." autocomplete="off" autofocus style="padding: var(--space-3) var(--space-4); font-size: 0.95rem;">
    </div>

    <!-- Quick Add Chips -->
    <div style="margin-bottom: var(--space-5);">
        <div style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: var(--space-2); text-transform: uppercase; letter-spacing: 0.04em;">Quick Add</div>
        <div class="flex gap-2 wrap">
            <button class="chip" onclick="quickSelectFood('chapati')">+ Chapati</button>
            <button class="chip" onclick="quickSelectFood('rice-cooked')">+ Rice</button>
            <button class="chip" onclick="quickSelectFood('dal-fry')">+ Dal</button>
            <button class="chip" onclick="quickSelectFood('paneer')">+ Paneer</button>
            <button class="chip" onclick="quickSelectFood('curd')">+ Curd</button>
            <button class="chip" onclick="quickSelectFood('boiled-egg')">+ Boiled Egg</button>
            <button class="chip" onclick="quickSelectFood('chai')">+ Chai</button>
            <button class="chip" onclick="quickSelectFood('banana')">+ Banana</button>
        </div>
    </div>

    <!-- Current Meal Tray (Compact & Collapsible) -->
    <div id="current-meal-panel" class="panel" style="display: none; border-color: var(--border-strong); margin-bottom: var(--space-5);">
        <div class="flex justify-between items-center" style="cursor: pointer;" onclick="toggleCurrentMeal()">
            <div>
                <span style="font-weight: 600; font-size: 0.92rem; color: var(--text-primary);">Current Meal</span>
                <span id="current-meal-summary" style="font-size: 0.8rem; color: var(--text-secondary); margin-left: var(--space-2);">0 kcal · 0 items</span>
            </div>
            <span id="current-meal-chevron" style="font-size: 0.8rem; color: var(--text-muted);">▼</span>
        </div>

        <div id="current-meal-items-list" style="margin-top: var(--space-3); border-top: 1px solid var(--border-subtle); padding-top: var(--space-2);">
            <!-- Items rendered by JS -->
        </div>

        <div style="margin-top: var(--space-4); display: flex; justify-content: flex-end; gap: var(--space-2);">
            <button class="btn btn-secondary btn-sm" onclick="clearCurrentMeal()">Clear</button>
            <button class="btn btn-primary btn-sm" onclick="commitCurrentMeal()">+ Add Food</button>
        </div>
    </div>

    <!-- Search Results Section -->
    <div>
        <div class="flex justify-between items-center mb-2" style="margin-bottom: var(--space-2);">
            <span id="results-count-label" style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;">Database Foods</span>
        </div>
        <div id="search-results-list" class="flex-col">
            <!-- Results rendered by JS -->
        </div>
    </div>
</div>

<!-- Portion Customizer Modal -->
<div id="portion-modal" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
        <div class="flex justify-between items-start mb-4" style="margin-bottom: var(--space-4);">
            <div>
                <h3 id="modal-food-name" style="font-size: 1.05rem; font-weight: 600; margin: 0;">Food Name</h3>
                <small id="modal-food-category" style="color: var(--text-muted);">Category</small>
            </div>
            <button class="btn-delete" onclick="closePortionModal()">✕</button>
        </div>

        <div class="grid-2 mb-4" style="margin-bottom: var(--space-4);">
            <div>
                <label style="font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: var(--space-1);">Quantity</label>
                <div class="flex items-center gap-1">
                    <button class="btn btn-secondary btn-sm" onclick="stepQty(-1)" style="padding: 6px 12px;">-</button>
                    <input type="number" id="modal-quantity" class="input text-center" value="1" min="0.1" step="0.5" style="font-weight: 600;">
                    <button class="btn btn-secondary btn-sm" onclick="stepQty(1)" style="padding: 6px 12px;">+</button>
                </div>
            </div>

            <div>
                <label style="font-size: 0.78rem; color: var(--text-muted); display: block; margin-bottom: var(--space-1);">Serving Unit</label>
                <select id="modal-unit" class="select">
                    <option value="piece">piece</option>
                    <option value="bowl">bowl (150g)</option>
                    <option value="cup">cup (240g)</option>
                    <option value="glass">glass (250ml)</option>
                    <option value="g">grams (g)</option>
                    <option value="tablespoon">tablespoon (15g)</option>
                    <option value="plate">plate (300g)</option>
                    <option value="serving">serving</option>
                </select>
            </div>
        </div>

        <!-- Macro Preview -->
        <div style="background: var(--surface-secondary); padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); margin-bottom: var(--space-5);">
            <div class="flex justify-between items-center mb-1">
                <span id="modal-calc-calories" style="font-size: 1.15rem; font-weight: 700; color: var(--text-primary);">0 kcal</span>
                <span id="modal-calc-grams" style="font-size: 0.8rem; color: var(--text-muted);">(0 g)</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);" id="modal-calc-macros">
                P: 0g · C: 0g · F: 0g
            </div>
        </div>

        <div class="flex justify-end gap-2">
            <button class="btn btn-secondary" onclick="closePortionModal()">Cancel</button>
            <button class="btn btn-primary" onclick="addModalFoodToTray()">Add to Meal</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let activeFoodItem = null;
    let currentMealTray = [];
    let isTrayExpanded = true;
    let allFoodsList = [];

    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const mealParam = params.get('meal');
        if (mealParam) {
            document.getElementById('meal-select').value = mealParam;
        }

        const searchInput = document.getElementById('search-input');
        let timer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                searchFoods(e.target.value);
            }, 200);
        });

        document.getElementById('modal-quantity').addEventListener('input', updateModalCalculations);
        document.getElementById('modal-unit').addEventListener('change', updateModalCalculations);

        searchFoods('');
    });

    async function searchFoods(query) {
        try {
            const res = await fetch(`/api/foods/search?q=${encodeURIComponent(query)}`);
            allFoodsList = await res.json();
            renderSearchResults(allFoodsList);
        } catch (err) {
            console.error(err);
        }
    }

    function renderSearchResults(foods) {
        const container = document.getElementById('search-results-list');
        document.getElementById('results-count-label').textContent = `${foods.length} Foods available`;

        if (foods.length === 0) {
            container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; padding: var(--space-4) 0; text-align: center;">No foods found.</div>`;
            return;
        }

        container.innerHTML = foods.map(food => `
            <div class="interactive-row flex justify-between items-center" onclick='openFoodModal("${escapeHtml(food.id)}")'>
                <div>
                    <div style="font-weight: 500; font-size: 0.9rem; color: var(--text-primary);">${escapeHtml(food.name)}</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 1px;">
                        ${Number(food.serving_size) || 1} ${escapeHtml(food.serving_unit || 'serving')} (${Number(food.grams_per_serving) || 100}g) · ${Math.round(food.calories_per_100g)} kcal/100g · P: ${Number(food.protein_per_100g)}g
                    </div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">+</div>
            </div>
        `).join('');
    }

    function quickSelectFood(foodId) {
        openFoodModal(foodId);
    }

    async function openFoodModal(foodId) {
        let food = allFoodsList.find(f => f.id === foodId);
        if (!food) {
            try {
                const res = await fetch(`/api/foods/${foodId}`);
                food = await res.json();
            } catch (e) {
                return;
            }
        }
        if (!food) return;

        activeFoodItem = food;
        document.getElementById('modal-food-name').textContent = food.name;
        document.getElementById('modal-food-category').textContent = food.category ? food.category.replace('_', ' ') : 'Food';

        document.getElementById('modal-quantity').value = food.serving_size || 1;
        
        const unitSelect = document.getElementById('modal-unit');
        if (food.serving_unit && Array.from(unitSelect.options).some(o => o.value === food.serving_unit)) {
            unitSelect.value = food.serving_unit;
        } else {
            unitSelect.value = 'g';
            document.getElementById('modal-quantity').value = food.grams_per_serving || 100;
        }

        updateModalCalculations();
        document.getElementById('portion-modal').style.display = 'flex';
    }

    function closePortionModal() {
        document.getElementById('portion-modal').style.display = 'none';
        activeFoodItem = null;
    }

    function stepQty(delta) {
        const input = document.getElementById('modal-quantity');
        let current = parseFloat(input.value) || 1;
        current = Math.max(0.5, current + delta);
        input.value = current;
        updateModalCalculations();
    }

    function updateModalCalculations() {
        if (!activeFoodItem) return;

        const qty = parseFloat(document.getElementById('modal-quantity').value) || 0;
        const unit = document.getElementById('modal-unit').value;

        let grams = qty;
        if (unit === 'g') {
            grams = qty;
        } else if (unit === activeFoodItem.serving_unit) {
            grams = qty * (activeFoodItem.grams_per_serving || 100);
        } else {
            const unitWeights = {
                'piece': 50, 'bowl': 150, 'cup': 240, 'glass': 250,
                'tablespoon': 15, 'plate': 300, 'serving': 150
            };
            grams = qty * (unitWeights[unit] || 100);
        }

        const mult = grams / 100;
        const cals = Math.round(activeFoodItem.calories_per_100g * mult);
        const p = Math.round(activeFoodItem.protein_per_100g * mult * 10) / 10;
        const c = Math.round(activeFoodItem.carbs_per_100g * mult * 10) / 10;
        const f = Math.round(activeFoodItem.fat_per_100g * mult * 10) / 10;

        document.getElementById('modal-calc-calories').textContent = `${cals} kcal`;
        document.getElementById('modal-calc-grams').textContent = `(${Math.round(grams)} g)`;
        document.getElementById('modal-calc-macros').textContent = `P: ${p}g · C: ${c}g · F: ${f}g`;
    }

    function addModalFoodToTray() {
        if (!activeFoodItem) return;

        const qty = parseFloat(document.getElementById('modal-quantity').value) || 1;
        const unit = document.getElementById('modal-unit').value;

        let grams = qty;
        if (unit === 'g') {
            grams = qty;
        } else if (unit === activeFoodItem.serving_unit) {
            grams = qty * (activeFoodItem.grams_per_serving || 100);
        } else {
            const unitWeights = {
                'piece': 50, 'bowl': 150, 'cup': 240, 'glass': 250,
                'tablespoon': 15, 'plate': 300, 'serving': 150
            };
            grams = qty * (unitWeights[unit] || 100);
        }

        const mult = grams / 100;
        const item = {
            id: 'itm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            food_id: activeFoodItem.id,
            name: activeFoodItem.name,
            quantity: qty,
            unit: unit,
            grams: Math.round(grams),
            calories: Math.round(activeFoodItem.calories_per_100g * mult),
            protein: Math.round(activeFoodItem.protein_per_100g * mult * 10) / 10,
            carbs: Math.round(activeFoodItem.carbs_per_100g * mult * 10) / 10,
            fat: Math.round(activeFoodItem.fat_per_100g * mult * 10) / 10
        };

        currentMealTray.push(item);
        renderCurrentMealTray();
        closePortionModal();
        showToast(`Added ${item.name}`);
    }

    function toggleCurrentMeal() {
        isTrayExpanded = !isTrayExpanded;
        document.getElementById('current-meal-items-list').style.display = isTrayExpanded ? 'block' : 'none';
        document.getElementById('current-meal-chevron').textContent = isTrayExpanded ? '▼' : '▶';
    }

    function renderCurrentMealTray() {
        const panel = document.getElementById('current-meal-panel');
        const list = document.getElementById('current-meal-items-list');

        if (currentMealTray.length === 0) {
            panel.style.display = 'none';
            return;
        }

        panel.style.display = 'block';
        const totalCals = currentMealTray.reduce((sum, itm) => sum + itm.calories, 0);
        document.getElementById('current-meal-summary').textContent = `${totalCals} kcal · ${currentMealTray.length} items logged`;

        list.innerHTML = currentMealTray.map((item, idx) => `
            <div class="data-row">
                <div>
                    <div style="font-weight: 500; font-size: 0.88rem;">${escapeHtml(item.name)}</div>
                    <div style="font-size: 0.78rem; color: var(--text-muted);">
                        ${escapeHtml(item.quantity)} ${escapeHtml(item.unit)} ${item.grams ? `· ${Number(item.grams)}g` : ''}
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span style="font-weight: 600; font-size: 0.88rem;">${Math.round(item.calories)} kcal</span>
                    <button class="btn-delete" onclick="removeTrayItem(${idx})" title="Remove">✕</button>
                </div>
            </div>
        `).join('');
    }

    function removeTrayItem(idx) {
        currentMealTray.splice(idx, 1);
        renderCurrentMealTray();
    }

    function clearCurrentMeal() {
        currentMealTray = [];
        renderCurrentMealTray();
    }

    function commitCurrentMeal() {
        if (currentMealTray.length === 0) return;

        const meal = document.getElementById('meal-select').value;
        const params = new URLSearchParams(window.location.search);
        const dateStr = params.get('date') || Storage.getTodayDateString();

        currentMealTray.forEach(item => {
            Storage.saveMealLog(dateStr, meal, item);
        });

        showToast(`Logged ${currentMealTray.length} items to ${meal}`);
        clearCurrentMeal();
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 300);
    }
</script>
{% endblock %}
